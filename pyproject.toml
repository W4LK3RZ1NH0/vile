[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vile"
version = "1.2.0"
description = "VILE - Vulnerability & Intelligence Lookup Engine"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "W4LK3R" },
]
keywords = ["security", "vulnerability", "scanner", "cve", "osv", "pentest", "red-team"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.25.0",
    "packaging>=20.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
vile = "vile.main:main"
